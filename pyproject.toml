[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-agent-guardrails"
version = "0.1.0"
description = "A minimal three-layer guardrails template for AI coding agents in Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Andrew Kingdom" }]
keywords = ["ai-agents", "coding-agents", "agents-md", "guardrails", "template"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/akingdom/python-agent-guardrails"
Source = "https://github.com/akingdom/python-agent-guardrails"
Issues = "https://github.com/akingdom/python-agent-guardrails/issues"

[project.scripts]
pag = "pag.install:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
release = [
  "build>=1.2",
  "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "install.py"]